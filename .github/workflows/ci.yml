# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# Adopted from the WS4 package CI (packages/sdk-*/ci/workflows/ci.yml); this copy is canonical.
# The package sits at the mirror repo root.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftpm:
    name: swift build + test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test --parallel
      - name: Privacy manifest is valid
        run: plutil -lint Sources/Referalli/PrivacyInfo.xcprivacy

  ios-simulator:
    # One build+test on a single simulator architecture: a generic destination builds every
    # arch (2x) and a separate build step compiled the large generated client twice.
    name: xcodebuild (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test on iOS simulator
        run: |
          set -o pipefail
          xcodebuild test -scheme Referalli \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO | tail -n 80

  other-apple-platforms:
    # tvOS / watchOS compile checks; informative, not a release gate.
    name: xcodebuild (tvOS, watchOS)
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build for tvOS and watchOS simulators
        run: |
          set -o pipefail
          for p in 'tvOS Simulator' 'watchOS Simulator'; do
            xcodebuild build -scheme Referalli -destination "generic/platform=$p" \
              CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO | tail -n 5
          done

  swift6:
    # Package.swift declares tools 5.9 (Swift 5 language mode). The tracker must also compile in
    # Swift 6 language mode with complete concurrency checking.
    name: Swift 6 language mode + strict concurrency
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build in Swift 6 mode
        run: swift build -Xswiftc -swift-version -Xswiftc 6
      - name: Build with complete concurrency checking (Swift 5 mode)
        run: swift build -Xswiftc -strict-concurrency=complete
