# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# SwiftPM resolves releases straight from X.Y.Z or vX.Y.Z tags at this repo's root, so releasing
# is the tag itself (pushed by the monorepo's sync-mirrors.ts --tag). This checks the version
# and creates the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the tag
        run: grep -Rq "\"${GITHUB_REF_NAME#v}\"" Sources --include='*Version*.swift'
      - run: swift build -c release
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
